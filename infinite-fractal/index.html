<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080e1b"><title>無限フラクタル探検</title><style>
*{box-sizing:border-box}body{margin:0;background:#080e1b;color:#ecf5ff;font:14px system-ui,sans-serif;height:100svh;overflow:hidden}canvas{position:absolute;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}header{position:absolute;top:max(22px,env(safe-area-inset-top));left:24px;pointer-events:none;text-shadow:0 2px 12px #000}small{color:#90cddc;letter-spacing:.24em;font-size:10px}h1{font-size:clamp(20px,4vw,30px);font-weight:500;letter-spacing:.12em;margin:6px 0}header p{color:#b9c9d6;font-size:12px;margin:4px 0}.panel{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(580px,calc(100% - 24px));padding:15px;background:#101c2ce8;border:1px solid #8dabc433;border-radius:20px;box-shadow:0 8px 40px #0006;backdrop-filter:blur(14px)}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.controls{display:flex;gap:7px}button,select{font:inherit;color:#eaf7ff;background:#26384b;border:1px solid #8cbac044;border-radius:11px;min-height:44px;padding:0 13px;cursor:pointer}button:hover,select:hover{background:#35516a}button:focus-visible,select:focus-visible,canvas:focus-visible{outline:2px solid #7ce8d5;outline-offset:3px}#zoom{font-variant-numeric:tabular-nums;color:#91eed9;font-size:16px}.info{display:flex;justify-content:space-between;gap:12px;color:#9cb4c7;font-size:11px;margin-top:12px}.destinations{display:flex;gap:7px;margin-top:12px}.destinations button{flex:1;font-size:12px;min-height:36px;background:#172838}.hint{position:absolute;right:22px;top:24px;color:#b5c6d8;font-size:11px;text-align:right;pointer-events:none}#status{max-width:65%;text-align:right}@media(max-width:600px){header{left:18px}.hint{display:none}.panel{padding:12px}.controls{gap:5px}button,select{padding:0 10px}.info{font-size:10px}}
</style></head><body><canvas id="view" tabindex="0" aria-label="マンデルブロ集合。矢印キーで移動、プラス・マイナスで拡大縮小、0でリセット"></canvas><header><small>THE MANDELBROT ATLAS</small><h1>無限フラクタル探検</h1><p>境界の向こうに、また新しい世界。</p></header><div class="hint">ドラッグで移動 · ホイールで拡大<br>ダブルクリックで、その場所へ</div><section class="panel" aria-label="探検の操作"><div class="row"><div><small>MAGNIFICATION</small><div id="zoom">× 1.0</div></div><div class="controls"><select id="palette" aria-label="色を変更"><option value="0">深海</option><option value="1">夕焼け</option><option value="2">翡翠</option><option value="3">銀河</option></select><button id="out" aria-label="縮小">−</button><button id="in" aria-label="拡大">＋</button><button id="reset" aria-label="位置と倍率をリセット">↺</button></div></div><div class="destinations"><button data-place="0">海馬の谷</button><button data-place="1">渦の回廊</button><button data-place="2">小さな宇宙</button></div><div class="info"><span>ピンチで拡大 · スワイプで移動</span><span id="status" role="status">描画を準備中</span></div></section>
<script id="renderer" type="text/plain">
let latest=0;
onmessage=async ({data:q})=>{const token=++latest;const {w,h,cx,cy,span,limit,palette,id,quick}=q;const pixels=new Uint8ClampedArray(w*h*4);const colors=[[[3,9,25],[12,47,97],[25,129,164],[124,228,218],[245,226,162],[39,58,119]],[[18,9,35],[92,28,81],[208,67,69],[255,158,85],[255,235,174],[99,35,78]],[[3,20,25],[7,67,70],[24,137,104],[145,227,150],[245,244,194],[10,69,92]],[[12,6,32],[49,24,106],[143,54,161],[238,131,191],[197,225,255],[38,61,131]]][palette];let start=performance.now();
for(let y=0;y<h;y++){const ci=cy+(y+.5-h/2)*span/w;for(let x=0;x<w;x++){const cr=cx+(x+.5-w/2)*span/w;let zr=0,zi=0,n=0;const a=cr-.25,b=a*a+ci*ci;const inside=b*(b+a)<=.25*ci*ci||(cr+1)*(cr+1)+ci*ci<=.0625;if(inside)n=limit;else while(zr*zr+zi*zi<=256&&n<limit){const next=zr*zr-zi*zi+cr;zi=2*zr*zi+ci;zr=next;n++;}const p=(y*w+x)*4;if(n===limit){pixels[p]=3;pixels[p+1]=7;pixels[p+2]=16;}else{const smooth=n+1-Math.log2(Math.log2(Math.hypot(zr,zi)));const t=((smooth*.027)%1+1)%1*colors.length;const k=Math.floor(t),f=t-k;for(let c=0;c<3;c++)pixels[p+c]=colors[k][c]*(1-f)+colors[(k+1)%colors.length][c]*f;}pixels[p+3]=255;}
if(performance.now()-start>9){await new Promise(r=>setTimeout(r,0));if(token!==latest)return;start=performance.now();}}
if(token===latest)postMessage({id,w,h,pixels,quick,cx,cy,span},[pixels.buffer]);};
</script><script>
'use strict';
const canvas=document.querySelector('#view'),ctx=canvas.getContext('2d',{alpha:false}),status=document.querySelector('#status'),zoomLabel=document.querySelector('#zoom');const buffer=document.createElement('canvas'),bc=buffer.getContext('2d',{alpha:false});let width=innerWidth,height=innerHeight,cx=-.55,cy=0,span=3.4,palette=0,job=0,settleTimer,frame=0,rendered=null;const points=new Map();
const blobURL=URL.createObjectURL(new Blob([document.querySelector('#renderer').textContent],{type:'text/javascript'}));const worker=new Worker(blobURL);URL.revokeObjectURL(blobURL);worker.onerror=()=>{status.textContent='描画エラー：ページを再読み込みしてください';};
function initialSpan(){return Math.max(3.4,2.7*width/height)}
function preview(){if(!rendered)return;const ratio=rendered.span/span;ctx.fillStyle='#030710';ctx.fillRect(0,0,canvas.width,canvas.height);const dx=(rendered.cx-cx)/span*canvas.width,dy=(rendered.cy-cy)/span*canvas.width;ctx.drawImage(buffer,canvas.width/2+dx-canvas.width*ratio/2,canvas.height/2+dy-canvas.height*ratio/2,canvas.width*ratio,canvas.height*ratio);}
worker.onmessage=({data:d})=>{if(d.id!==job)return;buffer.width=d.w;buffer.height=d.h;bc.putImageData(new ImageData(d.pixels,d.w,d.h),0,0);rendered=d;preview();status.textContent=d.quick?'操作中 · 軽量描画':span<=3.4e-12?'数値精度の上限です':'精細描画 · 計算は端末内';};
function render(quick){const scale=Math.min(quick?.26:Math.min(devicePixelRatio||1,1.5),Math.sqrt((quick?36000:850000)/(width*height)));const w=Math.max(1,Math.round(width*scale)),h=Math.max(1,Math.round(height*scale));const limit=quick?160:Math.min(2400,380+Math.floor(Math.log2(initialSpan()/span)*65));worker.postMessage({id:++job,w,h,cx,cy,span,limit,palette,quick});zoomLabel.textContent='× '+(initialSpan()/span).toLocaleString('ja-JP',{maximumFractionDigits:1});}
function changed(){job++;preview();clearTimeout(settleTimer);if(!frame)frame=requestAnimationFrame(()=>{frame=0;render(true)});status.textContent='操作中 · 軽量描画';settleTimer=setTimeout(()=>{if(!points.size)render(false)},180);}
function zoomAt(factor,x=width/2,y=height/2){const next=Math.min(initialSpan()*2,Math.max(3.4e-12,span*factor));cx+=(x-width/2)*(span-next)/width;cy+=(y-height/2)*(span-next)/width;span=next;changed();}
function resize(){const old=initialSpan();width=innerWidth;height=innerHeight;canvas.width=Math.round(width*Math.min(devicePixelRatio||1,1.5));canvas.height=Math.round(height*Math.min(devicePixelRatio||1,1.5));rendered=null;if(!job||span===old)span=initialSpan();changed();}
function geometry(){const a=[...points.values()];if(a.length===1)return{x:a[0].x,y:a[0].y,d:0};return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}}
canvas.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;canvas.setPointerCapture(e.pointerId);points.set(e.pointerId,{x:e.clientX,y:e.clientY});clearTimeout(settleTimer);};
canvas.onpointermove=e=>{if(!points.has(e.pointerId))return;const before=geometry();points.set(e.pointerId,{x:e.clientX,y:e.clientY});const after=geometry();const old=span;if(before.d>0&&after.d>0)span=Math.min(initialSpan()*2,Math.max(3.4e-12,span*before.d/after.d));cx+=(before.x-width/2)*old/width-(after.x-width/2)*span/width;cy+=(before.y-height/2)*old/width-(after.y-height/2)*span/width;changed();};
function release(e){points.delete(e.pointerId);if(!points.size){clearTimeout(settleTimer);settleTimer=setTimeout(()=>render(false),80)}}canvas.onpointerup=release;canvas.onpointercancel=release;canvas.onlostpointercapture=release;
canvas.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(Math.max(-.7,Math.min(.7,e.deltaY*(e.deltaMode===1?.03:.0015)))),e.clientX,e.clientY)},{passive:false});canvas.ondblclick=e=>zoomAt(.5,e.clientX,e.clientY);
document.querySelector('#in').onclick=()=>zoomAt(.5);document.querySelector('#out').onclick=()=>zoomAt(2);function reset(){cx=-.55;cy=0;span=initialSpan();changed()}document.querySelector('#reset').onclick=reset;document.querySelector('#palette').onchange=e=>{palette=+e.target.value;changed()};
const places=[[-.7435,.1314,.012],[-.7453,.1127,.003],[-1.768,0,.025]];document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{[cx,cy,span]=places[+b.dataset.place];changed()});
canvas.onkeydown=e=>{if(['+','=','-','0','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();if(e.key==='+'||e.key==='=')zoomAt(.5);else if(e.key==='-')zoomAt(2);else if(e.key==='0')reset();else{cx+=({'ArrowLeft':-1,'ArrowRight':1}[e.key]||0)*span*.1;cy+=({'ArrowUp':-1,'ArrowDown':1}[e.key]||0)*span*.1;changed()}}};window.addEventListener('resize',resize);resize();
</script></body></html>
