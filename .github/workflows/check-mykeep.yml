name: Validate Karin Workers
on:
  push:
    branches: [main]
    paths:
      - 'mykeep/**'
      - 'notepad/**'
      - '.github/workflows/check-mykeep.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  mykeep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mykeep/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: mykeep
      - name: Build MyKeep
        run: npm run build
        working-directory: mykeep
      - name: Run MyKeep checks
        run: node tests/pin-levels.mjs
        working-directory: mykeep
  notepad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check Notepad Worker
        run: node --check notepad/worker.js
