name: Build static art preview (verified JPEGs)
on:
  push:
    branches: [main]
    paths:
      - 'art-preference/scripts/build-frozen-preview.mjs'
      - '.github/workflows/build-frozen-art-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency: art-preview-static-image-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download only verified public domain JPEGs
        run: node art-preference/scripts/build-frozen-preview.mjs
      - name: Validate snapshot and code
        working-directory: art-preference
        run: npm run check
      - name: Commit immutable preview images and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art-preference/images/ art-preference/data/preview-artworks.json
          if ! git diff --cached --quiet; then
            git commit -m "data(art): freeze museum-verified preview images and catalog"
            git push
          fi
