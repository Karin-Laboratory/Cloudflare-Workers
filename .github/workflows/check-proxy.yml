name: Validate Karin Proxy
on:
  push:
    branches: [main]
    paths:
      - 'proxy/**'
      - '.github/workflows/check-proxy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'proxy/**'
      - '.github/workflows/check-proxy.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: proxy
      - name: Run syntax and unit checks
        run: npm run check
        working-directory: proxy
      - name: Check Wrangler bundle
        run: npx wrangler deploy --dry-run
        working-directory: proxy
