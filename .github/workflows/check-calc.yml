name: Validate Rust Calculator
on:
  push:
    branches: [main]
    paths: ['calc/**', '.github/workflows/check-calc.yml']
  pull_request:
    paths: ['calc/**', '.github/workflows/check-calc.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Rust and test actual WebAssembly ABI
        working-directory: calc
        run: sh ci-build.sh
