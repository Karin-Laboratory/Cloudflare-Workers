<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P-touch Web Studio</title>
<style>
:root{font:15px system-ui,sans-serif;color:#182435;background:#f3f5f9}*{box-sizing:border-box}body{margin:0}header{background:#182435;color:white;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}header small{color:#b8c6da}main{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:calc(100vh - 65px)}aside{background:white;padding:20px;border-right:1px solid #d9dfe8;overflow:auto}h1{font-size:19px;margin:0}h2{font-size:15px;margin:0 0 14px}label{display:block;margin:13px 0 5px;font-size:12px;font-weight:650;color:#536174}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #cdd5e0;border-radius:7px;background:white}textarea{height:78px;resize:vertical}button{border:1px solid #cbd4df;background:white;border-radius:7px;padding:9px 12px;cursor:pointer}button.primary{background:#2463e8;color:white;border-color:#2463e8}button:disabled{opacity:.5;cursor:not-allowed}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.stage{padding:26px;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;overflow:hidden}.paper{width:min(100%,850px);background:white;border:1px solid #dce2ec;box-shadow:0 12px 35px #24334a17;border-radius:12px;padding:28px;overflow:auto}.ruler{font-size:12px;color:#758397;margin-bottom:15px}.tape-wrap{padding:28px 10px;overflow:auto;background:repeating-linear-gradient(45deg,#f6f8fb,#f6f8fb 12px,#f0f3f8 12px,#f0f3f8 24px);border-radius:8px}.tape{position:relative;background:#fffef4;border-top:1px solid #e0d8b3;border-bottom:1px solid #e0d8b3;display:flex;align-items:center;justify-content:center;min-width:130px;margin:auto;box-shadow:0 3px 8px #0002}.printable{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;overflow:hidden}.printable img{object-fit:contain}.labeltext{white-space:pre-wrap;line-height:1.1;overflow:hidden;overflow-wrap:anywhere}.note{color:#63748b;font-size:12px;line-height:1.6}.templates{display:flex;gap:7px;flex-wrap:wrap}.templates button{font-size:12px}footer{font-size:12px;color:#64748b}.pill{font-size:12px;background:#33445c;padding:6px 9px;border-radius:99px}@media(max-width:750px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #ddd}.stage{padding:14px}.paper{padding:16px}}
</style>
<header><div><h1>P-touch Web Studio <small>GUI Preview</small></h1><small>Brother PT-P710BT · ブラウザ版ラベルエディター</small></div><span class="pill">印刷未接続</span></header>
<main><aside><h2>ラベル設定</h2><label for="text">印刷する文字</label><textarea id="text">Karin-Lab
Raspberry Pi 3</textarea>
<div class="pair"><div><label for="width">テープ幅</label><select id="width"><option>3.5</option><option>6</option><option>9</option><option selected>12</option><option>18</option><option>24</option></select></div><div><label for="length">長さ (mm)</label><input id="length" type="number" min="20" max="300" value="70"></div></div>
<div class="pair"><div><label for="size">文字サイズ</label><input id="size" type="range" min="8" max="56" value="24"></div><div><label for="align">文字揃え</label><select id="align"><option value="left">左</option><option value="center" selected>中央</option><option value="right">右</option></select></div></div>
<div class="pair"><div><label for="font">フォント</label><select id="font"><option value="sans-serif">ゴシック</option><option value="serif">明朝</option><option value="monospace">等幅</option></select></div><div><label for="margin">左右余白 (mm)</label><input id="margin" type="number" value="3" min="0" max="30"></div></div>
<div class="pair"><div><label><input id="bold" type="checkbox" style="width:auto"> 太字</label></div><div><label><input id="frame" type="checkbox" style="width:auto"> 枠線</label></div></div>
<label for="qr">QRコードの内容 (任意)</label><input id="qr" placeholder="https://example.com">
<label for="image">画像を追加 (任意)</label><input id="image" type="file" accept="image/*">
<label>テンプレート</label><div class="templates"><button data-tpl="server">機器管理</button><button data-tpl="cable">ケーブル</button><button data-tpl="shelf">棚ラベル</button><button data-tpl="blank">白紙</button></div>
<div class="actions"><button class="primary" id="png">PNG保存</button><button id="svg">SVG保存</button><button id="save">設定保存</button><button id="reset">リセット</button></div>
<p class="note">現段階はGUI先行版。Bluetooth通信・印刷・テープ幅の自動検出は未実装。プレビューはレイアウト確認用で、実機の印刷不可領域を完全には再現していません。</p>
</aside><section class="stage"><div class="paper"><div class="ruler" id="measure"></div><div class="tape-wrap"><div class="tape" id="tape"><div class="printable" id="printable"><span class="labeltext" id="preview"></span><img id="art" hidden></div></div></div></div><footer>Web GUI only · 設定はこのブラウザ内に保存 · MIT-style original implementation inspired by P-touch Studio</footer></section></main>
<script>
const ids=['text','width','length','size','align','font','margin','bold','frame','qr'];const el=id=>document.getElementById(id);let imgData='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
function config(){return Object.fromEntries(ids.map(id=>[id,el(id).type==='checkbox'?el(id).checked:el(id).value]))}
function render(){const c=config(),w=Number(c.width),len=Math.max(20,Number(c.length)||70),scale=5,mm=Math.max(0,Number(c.margin)||0);const tape=el('tape'),print=el('printable'),label=el('preview');tape.style.width=len*scale+'px';tape.style.height=Math.max(20,w*scale)+'px';print.style.height=Math.max(8,w*scale*.82)+'px';print.style.padding='0 '+mm*scale+'px';print.style.border=c.frame?'1px solid #222':'none';print.style.justifyContent=({left:'flex-start',center:'center',right:'flex-end'})[c.align];label.style.textAlign=c.align;label.style.fontFamily=c.font;label.style.fontWeight=c.bold?'700':'400';label.style.fontSize=Math.min(Number(c.size),Math.max(8,w*scale*.64))+'px';label.textContent=c.text;el('art').hidden=!imgData;el('art').src=imgData;el('art').style.maxHeight=w*scale*.72+'px';el('art').style.maxWidth=w*scale*1.4+'px';el('measure').textContent=w+' mm × '+len+' mm  |  プレビュー倍率 5 px/mm'+(c.qr?'  |  QRデータ入力済み（描画未実装）':'')}
function svg(){const c=config(),w=Number(c.width),len=Math.max(20,Number(c.length)||70),px=5;const lines=c.text.split('\n');const font=Math.min(Number(c.size),Math.max(8,w*px*.64));const x=c.align==='left'?Math.max(0,Number(c.margin))*px:c.align==='right'?len*px-Math.max(0,Number(c.margin))*px:len*px/2;const anchor={left:'start',center:'middle',right:'end'}[c.align];const height=w*px;const lh=font*1.1;const top=(height-(lines.length-1)*lh)/2;return '<svg xmlns="http://www.w3.org/2000/svg" width="'+len*px+'" height="'+height+'" viewBox="0 0 '+len*px+' '+height+'"><rect width="100%" height="100%" fill="white"/>'+(c.frame?'<rect x="2" y="2" width="'+(len*px-4)+'" height="'+(height-4)+'" fill="none" stroke="black"/>':'')+lines.map((s,i)=>'<text x="'+x+'" y="'+(top+i*lh)+'" text-anchor="'+anchor+'" dominant-baseline="middle" font-family="'+esc(c.font)+'" font-size="'+font+'" font-weight="'+(c.bold?'bold':'normal')+'">'+esc(s)+'</text>').join('')+'</svg>'}
function download(data,name,type){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
el('svg').onclick=()=>download(svg(),'ptouch-label.svg','image/svg+xml');el('png').onclick=()=>{const src=URL.createObjectURL(new Blob([svg()],{type:'image/svg+xml'}));const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');cv.width=im.width*2;cv.height=im.height*2;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cv.toBlob(b=>{if(b)download(b,'ptouch-label.png','image/png');URL.revokeObjectURL(src)})};im.src=src};
el('save').onclick=()=>{localStorage.setItem('ptouch-web-studio',JSON.stringify(config()));alert('設定をブラウザに保存しました')};el('reset').onclick=()=>{localStorage.removeItem('ptouch-web-studio');location.reload()};
document.querySelectorAll('[data-tpl]').forEach(b=>b.onclick=()=>{const presets={server:['karin-ai\n192.168.1.10',24,70],cable:['LAN-01\nSW ↔ NAS',12,65],shelf:['電子部品 / Parts',18,85],blank:['',12,70]};const [t,w,l]=presets[b.dataset.tpl];el('text').value=t;el('width').value=w;el('length').value=l;render()});
el('image').onchange=e=>{const f=e.target.files[0];if(!f){imgData='';render();return}const r=new FileReader();r.onload=()=>{imgData=r.result;render()};r.readAsDataURL(f)};
ids.forEach(id=>el(id).addEventListener('input',render));try{const saved=JSON.parse(localStorage.getItem('ptouch-web-studio'));if(saved)ids.forEach(id=>{if(saved[id]!==undefined){if(el(id).type==='checkbox')el(id).checked=saved[id];else el(id).value=saved[id]}})}catch{}render();
</script></html>
