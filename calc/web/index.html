<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f2eee5">
<meta name="description" content="電卓。Rustで作った、小さな計算の道具。">
<title>電卓。 — Karin Laboratory</title>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header><a href="https://karin-lab.com">KARIN LABORATORY</a><span>SMALL TOOLS / 01</span></header>
<main>
<div class="intro"><p class="eyebrow">JUST A CALCULATOR.</p><h1>電卓<span>。</span></h1><p>考えるための、ちいさな余白。</p></div>
<section class="calculator" aria-label="電卓">
<div class="topline"><span>KARIN / RUST EDITION</span><span id="status" role="status">起動中</span></div>
<div class="screen"><label for="expression">EXPRESSION</label><input id="expression" aria-label="計算式" autocomplete="off" spellcheck="false" placeholder="0" maxlength="4096" inputmode="decimal"><output id="result" aria-live="polite">0</output></div>
<div class="toolbar"><button id="science" aria-expanded="false">関数 ▾</button><button id="angle" aria-label="角度単位">DEG</button><button id="copy">コピー</button></div>
<div id="functions" class="functions" hidden></div>
<div class="keys" id="keys"></div>
<p class="hint">Enter で計算 · Esc でクリア</p>
</section>
<aside><div class="history-heading"><h2>計算のあと</h2><button id="clear-history">消去</button></div><p id="empty">ここに、計算の足あとが残ります。</p><ol id="history"></ol></aside>
</main>
<footer><span>RUST → WEBASSEMBLY · NO EXTERNAL LIBRARIES</span><a href="https://github.com/Karin-Laboratory/Cloudflare-Workers/tree/main/calc">ソースを読む ↗</a></footer>
</body></html>
